<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badyet — Personal Budget Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e2038">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Badyet">
<script>
/* Early error reporter — shows a readable message instead of a blank page. */
(function(){
  function show(msg,where){
    try{
      if(!document.body)return;
      var d=document.getElementById('fatalErr');
      if(!d){d=document.createElement('div');d.id='fatalErr';document.body.appendChild(d);}
      d.style.display='block';
      d.innerHTML='<b>Badyet hit an error.</b> '+msg+
        '<small>'+where+' &nbsp;\u00b7&nbsp; If you copied this file by hand, the copy may be incomplete. Details are in the browser console (F12).</small>';
    }catch(e){}
  }
  window.addEventListener('error',function(ev){
    var fn=String(ev.filename||'');
    if(ev.message==='Script error.'||/script\.google|googleusercontent/.test(fn)||(ev.target&&ev.target.tagName==='SCRIPT'))return;
    if(ev.message||ev.error)show(String(ev.message||((ev.error&&ev.error.message)||'Error')),String(ev.filename||'')+(ev.lineno?(' line '+ev.lineno):''));
  },true);
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev.reason;show(String((r&&r.message)||r),'promise');
  });
})();
</script>
<style>
:root{
  --navy:#0e2038; --navy2:#0a1729; --navy3:#16304f;
  --ink:#182635; --muted:#5a6b7d; --bg:#f1f4f7; --card:#ffffff; --line:#e2e8ee;
  --teal:#0f9d8f; --tealbg:#e4f5f2; --red:#d5475e; --redbg:#fbe9ec;
  --orange:#e08a3c; --orangebg:#fdf1e4; --soft:#eef2f6;
  --r:12px; --shadow:0 1px 2px rgba(14,32,56,.06),0 4px 14px rgba(14,32,56,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink)}
.ic{vertical-align:-3px;flex:none}
h1,h2,h3,h4{font-weight:700;line-height:1.25}
a{color:var(--teal)}
a.btn{text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

#fatalErr{display:none;position:fixed;left:12px;right:12px;top:12px;z-index:9999;background:#d5475e;color:#fff;padding:12px 16px;border-radius:10px;font:13px/1.5 -apple-system,"Segoe UI",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#fatalErr small{display:block;opacity:.85;margin-top:6px}

/* ---------- Layout ---------- */
#app{min-height:100vh}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--navy);color:#c7d3e0;display:flex;flex-direction:column;z-index:60;transition:transform .22s ease,width .22s ease}
#main{margin-left:248px;min-height:100vh;display:flex;flex-direction:column;transition:margin-left .22s ease}
body.sb-collapsed #sidebar{width:70px}
body.sb-collapsed #main{margin-left:70px}
body.sb-collapsed .nav-label,body.sb-collapsed #sbFootTxt,body.sb-collapsed #demoChip{display:none}
body.sb-collapsed .nav-item{justify-content:center}
body.sb-collapsed #brandTxt{display:none}
body.sb-collapsed #sbCollapseIc{transform:rotate(180deg)}
#brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
#brandMark{width:34px;height:34px;border-radius:9px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
#brandTxt{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:21px;color:#fff;letter-spacing:.2px}
#navList{flex:1;overflow-y:auto;padding:6px 10px 10px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:9px;color:#c7d3e0;font-weight:500;text-align:left;position:relative;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--navy3);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--orange)}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
#sbCollapse{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.09);color:#8fa2b6;width:100%;text-align:left}
#sbCollapse:hover{color:#fff}
#sbCollapseIc{display:inline-flex;transition:transform .2s}
#sbFoot{padding:0 18px 14px;font-size:11px;color:#74879c;line-height:1.45}
#demoChip{display:inline-block;margin-bottom:8px;background:rgba(224,138,60,.18);color:#f0b47a;border:1px solid rgba(224,138,60,.4);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.4px;text-transform:uppercase}
#overlay{position:fixed;inset:0;background:rgba(10,23,41,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}

#topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap}
#burger{display:none;color:var(--muted)}
#secTitle{font-size:19px;font-weight:800}
#secSub{font-size:12px;color:var(--muted);margin-top:1px}
#tbRight{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#monthGroup{display:flex;align-items:center;gap:2px;background:var(--soft);border-radius:10px;padding:3px 6px}
#monthGroup button{padding:4px 6px;border-radius:7px;color:var(--muted)}
#monthGroup button:hover{background:#fff;color:var(--ink)}
#monthPick{border:none;background:transparent;font-weight:700;color:var(--ink);padding:4px 2px;font-variant-numeric:tabular-nums}
#view{padding:22px 26px 60px;max-width:1240px;width:100%;margin:0 auto}

/* ---------- Sync chip ---------- */
#syncChip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
#syncChip:hover{background:var(--soft);color:var(--ink)}
#syncChip .dot{width:8px;height:8px;border-radius:99px;background:#b9c5d1;flex:none}
#syncChip.ok{color:#0b6d64;border-color:#bfe5df}
#syncChip.ok .dot{background:var(--teal);box-shadow:0 0 0 3px rgba(15,157,143,.18)}
#syncChip.saving .dot,#syncChip.connecting .dot{background:var(--orange);animation:pulse 1s infinite}
#syncChip.error{color:var(--red);border-color:#eec6cd;background:var(--redbg)}
#syncChip.error .dot{background:var(--red)}
#syncChip.off{border-style:dashed;color:var(--teal);border-color:var(--teal)}
@keyframes pulse{50%{opacity:.3}}

/* ---------- Buttons / chips / badges ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;color:var(--ink);transition:filter .12s}
.btn:hover{filter:brightness(.965)}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{filter:brightness(.94)}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-danger{border-color:#eec6cd;background:var(--redbg);color:var(--red)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--soft);color:var(--ink)}
.btn-sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn.danger:hover{background:var(--redbg);color:var(--red)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.2px}
.b-income{background:var(--tealbg);color:var(--teal)}
.b-expense{background:var(--redbg);color:var(--red)}
.b-transfer{background:var(--soft);color:var(--muted)}
.b-pay{background:#e7edf6;color:#3e6fa3}
.b-refund{background:#eae6f6;color:#7a5fb0}
.b-ok{background:var(--tealbg);color:var(--teal)}
.b-watch{background:var(--orangebg);color:var(--orange)}
.b-over{background:var(--redbg);color:var(--red)}
.b-mut{background:var(--soft);color:var(--muted)}
.cat-chip{font-size:11.5px;background:var(--soft);border-radius:6px;padding:1px 7px;color:var(--muted);font-weight:600;white-space:nowrap}
.tag{font-size:10.5px;background:#f0f3f7;border:1px solid var(--line);border-radius:99px;padding:0 6px;color:var(--muted)}

/* ---------- Panels & grids ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h3{font-size:14.5px;font-weight:700}
.panel-head .sub{font-size:12px;color:var(--muted);font-weight:400}
.panel-body{padding:16px 18px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.g-3{grid-template-columns:1fr 1fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.span-2{grid-column:span 2}
.grid>*{min-width:0}

/* ---------- Stat rail ---------- */
.statrail{display:flex;flex-wrap:wrap}
.statrail .stat{padding:12px 20px;border-left:1px solid var(--line);flex:1;min-width:130px;cursor:default}
.statrail .stat:first-child{border-left:none;padding-left:0}
.stat.clickable{cursor:pointer}
.stat.clickable:hover{background:var(--soft);border-radius:8px}
.stat .lb{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.stat .vl{font-size:21px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .vl.small{font-size:16px}
.stat .vl{white-space:nowrap}
#hero .stat .vl{font-size:clamp(15px,1.5vw,20px)}
.pos{color:var(--teal)} .neg{color:var(--red)} .warnc{color:var(--orange)}

/* ---------- Hero ---------- */
#hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
#hero .lb{color:#8fa2b6;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
#hero .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#hero .sub{color:#aebcc9;font-size:12.5px}
.posbar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:8px 0 4px;background:rgba(255,255,255,.12);max-width:340px}
.posbar .a{background:var(--teal)} .posbar .b{background:var(--red)}
.chip-link{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.chip-link:hover{background:rgba(255,255,255,.16)}
#hero .statrail .stat{border-color:rgba(255,255,255,.12)}
#hero .stat .lb{color:#8fa2b6}
#hero .stat .vl{color:#fff}
#hero .stat.clickable:hover{background:rgba(255,255,255,.07)}

/* ---------- Meters / hbars ---------- */
.meter{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1}
.meter-fill{height:100%;border-radius:99px;background:var(--teal);transition:width .4s ease}
.hbar{padding:7px 0;border-bottom:1px dashed var(--line)}
.hbar:last-child{border-bottom:none}
.hbar.clickable{cursor:pointer}
.hbar.clickable:hover{background:var(--soft)}
.hbar-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.hbar-lb{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar-sub{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ---------- Tables ---------- */
.table-scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr.rowlink{cursor:pointer}
.tbl tbody tr.rowlink:hover{background:#f7f9fb}
.tbl .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .r{text-align:right}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--ink)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty .ic{color:#b9c5d1;margin-bottom:8px}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:10px 14px 12px;font-size:12.5px;color:var(--muted)}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.field .hint{font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}
.inp{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,157,143,.13)}
textarea.inp{resize:vertical;min-height:60px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-err{background:var(--redbg);color:var(--red);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
.form-err.show{display:block}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--teal)}

/* ---------- Filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-end}
.filters .field{margin:0;min-width:120px}
.filters .field.grow{flex:1;min-width:180px}

/* ---------- Charts ---------- */
.chart-wrap{position:relative}
.chart-wrap svg.chart{display:block;width:100%;height:auto}
.ct{font-size:10.5px;fill:#5a6b7d;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.chart-tip{position:absolute;display:none;background:var(--navy);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none;z-index:5;box-shadow:0 4px 14px rgba(14,32,56,.3);min-width:110px}
.chart-tip b{display:block;font-size:11px;color:#aebcc9;font-weight:600}
.chart-tip .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.chart-tip .dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px}
.nochart{padding:26px;text-align:center;color:var(--muted);font-size:13px;background:var(--soft);border-radius:9px}
.donut-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-legend{flex:1;min-width:180px}
.dl-item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:12.5px}
.dl-item:hover{background:var(--soft)}
.dl-item .sw{width:10px;height:10px;border-radius:3px;flex:none}
.dl-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-item .vv{font-weight:700;font-variant-numeric:tabular-nums}
.chov{transition:opacity .15s}
.chov:hover{opacity:.75}

/* ---------- Insights ---------- */
.insight{display:flex;gap:11px;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:9px;align-items:flex-start}
.insight.warn{border-color:#f2d9b6;background:#fdf7ee}
.insight.danger{border-color:#eec6cd;background:var(--redbg)}
.insight.good{border-color:#bfe5df;background:var(--tealbg)}
.insight .ii{flex:none;margin-top:2px}
.insight.warn .ii{color:var(--orange)} .insight.danger .ii{color:var(--red)} .insight.good .ii{color:var(--teal)} .insight.info .ii{color:#3e6fa3}
.insight .tx{flex:1;min-width:0}
.insight .tx b{display:block;font-size:13px}
.insight .tx span{font-size:12.5px;color:var(--muted)}
.insight .act-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}

/* ---------- Modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,23,41,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 18px 60px rgba(10,23,41,.35);margin-bottom:40px;animation:min .2s ease}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-wide{max-width:860px}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px;flex:1;display:flex;align-items:center;gap:8px}
.modal-body{padding:18px 20px;max-height:72vh;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{font-variant-numeric:tabular-nums}

/* ---------- Setup wizard ---------- */
.steps{counter-reset:st;list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 0 18px 42px;font-size:13.5px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:99px;background:var(--navy);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps li::after{content:"";position:absolute;left:13.5px;top:30px;bottom:4px;width:1px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li>b{display:block;margin-bottom:3px;font-size:14px}
.steps .muted{color:var(--muted);font-size:12.5px;display:block}
.codebox{background:var(--navy2);color:#cfe3f5;font:11.5px/1.55 ui-monospace,Menlo,Consolas,monospace;border-radius:9px;padding:10px 12px;max-height:130px;overflow:auto;white-space:pre;margin-top:8px}
.kbd{display:inline-block;background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:10px;background:#fff}
.choice:hover{border-color:var(--teal);background:var(--tealbg)}
.choice .ci{width:36px;height:36px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy)}
.choice b{display:block;font-size:14px}
.choice span{font-size:12.5px;color:var(--muted)}
.connect-banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(100deg,#e4f5f2,#eef6ff);border:1px solid #bfe5df;border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.connect-banner .t{flex:1;min-width:220px}
.connect-banner b{display:flex;align-items:center;gap:7px;font-size:14px}
.connect-banner span{font-size:12.5px;color:#2f5e6b}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(15,157,143,.5)}100%{box-shadow:0 0 0 14px rgba(15,157,143,0)}}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(10,23,41,.35);display:flex;align-items:center;gap:9px;max-width:360px;animation:tin .25s ease}
.toast.err{background:var(--red)} .toast.ok{background:var(--teal)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Misc ---------- */

<script type="text/plain" id="gasCode">
/**
 * BADYET  <->  GOOGLE SHEETS BRIDGE
 * ------------------------------------------------------------------
 * 1. In your Google Sheet: Extensions > Apps Script.
 * 2. Delete everything in the editor, paste this whole file, save (Ctrl/Cmd+S).
 * 3. Deploy > New deployment > gear icon > "Web app"
 *      Execute as:      Me
 *      Who has access:  Anyone
 *    Click Deploy, authorize, then copy the Web app URL (ends in /exec).
 * 4. Paste that URL into Badyet (Settings > Google Sheet, or the setup wizard).
 *
 * The script creates these tabs automatically the first time it runs:
 *   Categories, Accounts, Transactions, Budgets, Bills, Goals, Settings
 *
 * Editing tips (in the sheet):
 *   - New row? Leave the "id" cell blank; an id is filled in automatically.
 *   - Delete a row to delete the record.
 *   - Account columns (fromAccount, toAccount, account) use the account NAME.
 *   - Dates as YYYY-MM-DD (e.g. 2026-10-14). Budget month as YYYY-MM.
 *
 * Version 4 (the deployment now serves the Badyet app itself at its /exec URL).
 * Version 5 adds an OPTIONAL passcode (see the PASSCODE section below). If you do
 *           not set one, everything works exactly like version 4.
 *
 * After pasting a NEW version of this script: Deploy > Manage deployments >
 * edit (pencil) > Version: "New version" > Deploy. The URL stays the same.
 */

var TABLES = {
  Categories:   { key: 'name', cols: ['name', 'kind', 'essential'] },
  Accounts:     { key: 'id',   cols: ['id', 'name', 'type', 'openingBalance', 'openingDate', 'notes', 'archived', 'apr', 'minPayment', 'dueDay', 'plannedPayment'] },
  Transactions: { key: 'id',   cols: ['id', 'date', 'type', 'description', 'amount', 'category', 'fromAccount', 'toAccount', 'method', 'notes', 'tags', 'recurringId', 'refundOf'] },
  Budgets:      { key: 'id',   cols: ['id', 'month', 'category', 'amount', 'scope'] },
  Bills:        { key: 'id',   cols: ['id', 'description', 'type', 'amount', 'category', 'account', 'frequency', 'startDate', 'endDate', 'nextDue', 'status'] },
  Goals:        { key: 'id',   cols: ['id', 'name', 'target', 'saved', 'targetDate', 'monthlyContribution'] },
  Settings:     { key: 'key',  cols: ['key', 'value'] }
};
var NUMERIC = ['openingBalance', 'apr', 'minPayment', 'dueDay', 'plannedPayment', 'amount', 'target', 'saved', 'monthlyContribution'];
var BOOLEAN = ['archived', 'essential'];
var LISTS = {
  Accounts:     { type: ['cash', 'bank', 'ewallet', 'savings', 'credit', 'loan'] },
  Transactions: { type: ['income', 'expense', 'transfer', 'cc_payment', 'refund'] },
  Budgets:      { scope: ['monthly', 'weekly'] },
  Bills:        { type: ['income', 'expense'], frequency: ['weekly', 'biweekly', 'monthly', 'quarterly', 'annually'], status: ['active', 'paused'] },
  Categories:   { kind: ['expense', 'income'] }
};
var LOOKUPS = {
  Transactions: { category: ['Categories', 'A'], fromAccount: ['Accounts', 'B'], toAccount: ['Accounts', 'B'] },
  Budgets:      { category: ['Categories', 'A'] },
  Bills:        { category: ['Categories', 'A'], account: ['Accounts', 'B'] }
};

/* ---------------- Optional passcode ----------------
 * To turn it ON:  Apps Script > Project Settings (gear icon) > Script properties >
 *                 Add script property.  Name: BADYET_PASSCODE   Value: your passcode
 *                 (use 12+ characters), then Deploy > Manage deployments > pencil >
 *                 New version > Deploy.
 * To turn it OFF: delete that property and deploy a new version.
 * While ON:  requests without the right passcode are refused, and the page shown at
 *            the /exec link itself is locked (use your GitHub/installed app instead).
 * The passcode is stored in Google's Script properties, never in this code.
 */
function passcode_() { return PropertiesService.getScriptProperties().getProperty('BADYET_PASSCODE') || ''; }
function locked_() { return passcode_() !== ''; }
function authOk_(given) { var pc = passcode_(); return pc === '' || String(given == null ? '' : given) === pc; }
var LOCKED_MSG = 'Locked: wrong or missing passcode.';

/* ---------------- Web app entry points ---------------- */
function doGet(e) {
  var p = (e && e.parameter) || {};
  // No parameters => serve the Badyet app itself (the published /exec URL IS the app).
  if (!p.action && !p.callback) {
    if (locked_()) {
      return HtmlService.createHtmlOutput('<p style="font-family:sans-serif;padding:24px">Badyet is locked. Please open your installed Badyet app instead.</p>')
        .setTitle('Badyet (locked)');
    }
    return HtmlService.createHtmlOutputFromFile('Index')
      .setTitle('Badyet \u2014 Budget Tracker')
      .addMetaTag('viewport', 'width=device-width, initial-scale=1')
      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
  }
  var cb = (p.callback && /^[A-Za-z_$][\w$.]{0,80}$/.test(p.callback)) ? p.callback : null;
  var res;
  var lock = LockService.getScriptLock();
  var locked = false;
  try {
    if (!authOk_(p.key)) throw new Error(LOCKED_MSG);
    locked = lock.tryLock(8000);
    res = { ok: true, app: 'badyet', version: 3, data: readAll_() };
  } catch (err) {
    res = { ok: false, error: String((err && err.message) || err) };
  } finally {
    if (locked) { try { lock.releaseLock(); } catch (x) {} }
  }
  if (cb) {
    return ContentService.createTextOutput(cb + '(' + JSON.stringify(res) + ');')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return out_(res);
}

function doPost(e) {
  var body;
  try { body = JSON.parse((e && e.postData && e.postData.contents) || '{}'); }
  catch (err) { return out_({ ok: false, error: 'Bad request' }); }
  if (!authOk_(body.key)) return out_({ ok: false, error: LOCKED_MSG });
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(25000);
    ensureSheets_();
    if (body.action === 'replace') {
      Object.keys(TABLES).forEach(function (name) {
        applyTable_(name, (body.data && body.data[name]) || [], [], true);
      });
    } else if (body.action === 'apply') {
      var byTable = {};
      (body.ops || []).forEach(function (op) {
        if (!TABLES[op.table]) return;
        var b = byTable[op.table] = byTable[op.table] || { ups: [], dels: [] };
        if (op.op === 'upsert') b.ups = b.ups.concat(op.rows || []);
        if (op.op === 'delete') b.dels = b.dels.concat(op.keys || []);
      });
      Object.keys(byTable).forEach(function (t) { applyTable_(t, byTable[t].ups, byTable[t].dels, false); });
    }
    SpreadsheetApp.flush();
    return out_({ ok: true, data: readAll_() });
  } catch (err) {
    return out_({ ok: false, error: String((err && err.message) || err) });
  } finally {
    try { lock.releaseLock(); } catch (x) {}
  }
}

/* ---- Called directly by the hosted page (google.script.run) ---- */
function apiGet() {
  if (locked_()) throw new Error(LOCKED_MSG);
  ensureSheets_();
  return readAll_();
}
function apiApply(ops) {
  if (locked_()) throw new Error(LOCKED_MSG);
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    ensureSheets_();
    var byTable = {};
    (ops || []).forEach(function (op) {
      if (!TABLES[op.table]) return;
      var b = byTable[op.table] = byTable[op.table] || { ups: [], dels: [] };
      if (op.op === 'upsert') b.ups = b.ups.concat(op.rows || []);
      if (op.op === 'delete') b.dels = b.dels.concat(op.keys || []);
    });
    Object.keys(byTable).forEach(function (t) { applyTable_(t, byTable[t].ups, byTable[t].dels, false); });
    SpreadsheetApp.flush();
    return readAll_();
  } finally { try { lock.releaseLock(); } catch (x) {} }
}
function apiReplace(data) {
  if (locked_()) throw new Error(LOCKED_MSG);
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    ensureSheets_();
    Object.keys(TABLES).forEach(function (name) { applyTable_(name, (data && data[name]) || [], [], true); });
    SpreadsheetApp.flush();
    return readAll_();
  } finally { try { lock.releaseLock(); } catch (x) {} }
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

/* ---------------- Sheet setup ---------------- */
function ensureSheets_() {
  var ss = SpreadsheetApp.getActive();
  var created = false;
  Object.keys(TABLES).forEach(function (name) {
    var sh = ss.getSheetByName(name);
    if (!sh) { sh = ss.insertSheet(name); created = true; setupSheet_(sh, name); }
    else if (String(sh.getRange(1, 1).getValue()).trim() === '') { setupSheet_(sh, name); }
  });
  if (created) {
    var s1 = ss.getSheetByName('Sheet1');
    if (s1 && s1.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(s1);
  }
}

function setupSheet_(sh, name) {
  var t = TABLES[name], ss = sh.getParent();
  sh.getRange(1, 1, 1, t.cols.length).setValues([t.cols])
    .setFontWeight('bold').setBackground('#0e2038').setFontColor('#ffffff');
  sh.setFrozenRows(1);
  var max = Math.max(sh.getMaxRows() - 1, 1);
  t.cols.forEach(function (c, i) {
    var col = sh.getRange(2, i + 1, max, 1);
    if (NUMERIC.indexOf(c) >= 0) { if (c !== 'apr' && c !== 'dueDay') col.setNumberFormat('#,##0.00'); }
    else if (BOOLEAN.indexOf(c) < 0) col.setNumberFormat('@');
    var list = LISTS[name] && LISTS[name][c];
    if (list) col.setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(list, true).setAllowInvalid(true).build());
    var lk = LOOKUPS[name] && LOOKUPS[name][c];
    if (lk) {
      var src = ss.getSheetByName(lk[0]);
      if (src) col.setDataValidation(SpreadsheetApp.newDataValidation().requireValueInRange(src.getRange(lk[1] + '2:' + lk[1]), true).setAllowInvalid(true).build());
    }
  });
  sh.autoResizeColumns(1, t.cols.length);
}

function formatCols_(sh, name, head, n) {
  head.forEach(function (c, i) {
    if (TABLES[name].cols.indexOf(c) < 0) return;
    if (NUMERIC.indexOf(c) >= 0 || BOOLEAN.indexOf(c) >= 0) return;
    sh.getRange(2, i + 1, n, 1).setNumberFormat('@');
  });
}

/* ---------------- Read ---------------- */
function cell_(v, h, tz) {
  if (v instanceof Date) return Utilities.formatDate(v, tz, h === 'month' ? 'yyyy-MM' : 'yyyy-MM-dd');
  return v;
}

function readAll_() {
  ensureSheets_();
  var ss = SpreadsheetApp.getActive(), tz = ss.getSpreadsheetTimeZone(), out = {};
  Object.keys(TABLES).forEach(function (name) {
    var t = TABLES[name], sh = ss.getSheetByName(name), vals = sh.getDataRange().getValues();
    var head = (vals[0] || []).map(function (h) { return String(h).trim(); });
    var k = head.indexOf(t.key), rows = [], fixes = [];
    for (var i = 1; i < vals.length; i++) {
      var r = vals[i];
      if (r.every(function (v) { return v === '' || v === null; })) continue;
      var o = {};
      head.forEach(function (h, j) { if (h) o[h] = cell_(r[j], h, tz); });
      if (k >= 0 && String(r[k]).trim() === '') {
        if (t.key !== 'id') continue;
        o.id = 's' + Utilities.getUuid().replace(/-/g, '').slice(0, 12);
        fixes.push([i + 1, k + 1, o.id]);
      }
      rows.push(o);
    }
    fixes.forEach(function (f) { sh.getRange(f[0], f[1]).setNumberFormat('@').setValue(f[2]); });
    out[name] = rows;
  });
  return out;
}

/* ---------------- Write ---------------- */
function applyTable_(name, ups, dels, replaceAll) {
  var t = TABLES[name], ss = SpreadsheetApp.getActive(), sh = ss.getSheetByName(name);
  var tz = ss.getSpreadsheetTimeZone();
  var vals = sh.getDataRange().getValues();
  var head = (vals[0] || []).map(function (h) { return String(h).trim(); });
  var idx = {};
  head.forEach(function (h, i) { if (h) idx[h] = i; });
  t.cols.forEach(function (c) { if (!(c in idx)) { idx[c] = head.length; head.push(c); } });
  var W = head.length, oldW = (vals[0] || []).length, oldN = Math.max(0, vals.length - 1);

  var rows = replaceAll ? [] : vals.slice(1).map(function (r) {
    r = r.map(function (v, j) { return cell_(v, head[j], tz); });
    while (r.length < W) r.push('');
    return r;
  });
  var k = idx[t.key];
  var del = {};
  (dels || []).forEach(function (x) { del[String(x)] = 1; });
  rows = rows.filter(function (r) { return !del[String(r[k]).trim()]; });
  var pos = {};
  rows.forEach(function (r, i) { var key = String(r[k]).trim(); if (key) pos[key] = i; });
  (ups || []).forEach(function (o) {
    var key = String(o[t.key] == null ? '' : o[t.key]);
    if (!key) return;
    var r;
    if (Object.prototype.hasOwnProperty.call(pos, key)) r = rows[pos[key]];
    else { r = []; for (var i = 0; i < W; i++) r.push(''); rows.push(r); pos[key] = rows.length - 1; }
    t.cols.forEach(function (c) {
      if (Object.prototype.hasOwnProperty.call(o, c)) r[idx[c]] = (o[c] === null || o[c] === undefined) ? '' : o[c];
    });
  });
  rows = rows.filter(function (r) { return r.some(function (v) { return v !== '' && v !== null; }); });

  sh.getRange(1, 1, 1, W).setValues([head]);
  if (rows.length) {
    formatCols_(sh, name, head, rows.length);
    sh.getRange(2, 1, rows.length, W).setValues(rows);
  }
  if (oldN > rows.length) sh.getRange(rows.length + 2, 1, oldN - rows.length, Math.max(W, oldW)).clearContent();
}

/* Run this once from the editor (select "testSetup" > Run) if you want to
   create the tabs and grant permissions before deploying. */
function testSetup() {
  ensureSheets_();
  Logger.log(JSON.stringify(readAll_()).slice(0, 500));
}
</script>
<script>
"use strict";
/* =====================================================================
   BADYET — Personal Budget Tracker — v2.0 (Google Sheets sync)
   ---------------------------------------------------------------------
   Storage: a Google Sheet (via a small Apps Script "bridge" web app).
   The browser keeps a local copy for speed; the sheet is the source of
   truth. Changes made in the app are pushed within ~0.5s; changes made
   in the sheet are pulled every 15 seconds.

   ACCOUNTING MODEL
   Account types: cash | bank | ewallet | savings  -> assets
                  credit | loan                    -> liabilities (owed)
   income / expense / refund / transfer / cc_payment, where transfers and
   card payments are never counted as income or expense, refunds reduce
   category spending, and balances = opening balance + ledger effects.
   ===================================================================== */

/* ---------------- Utilities ---------------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
const round2=n=>Math.round((+n||0)*100)/100;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const PESO=new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',minimumFractionDigits:2,maximumFractionDigits:2});
const PESO0=new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:0});
const money=n=>PESO.format(round2(n||0));
const money0=n=>PESO0.format(Math.round(n||0));
const signed=n=>{n=round2(n||0);return (n>0?'+':n<0?'\u2212':'')+money(Math.abs(n));};
const pctStr=n=>Math.round(n)+'%';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONS_F=['January','February','March','April','May','June','July','August','September','October','November','December'];
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseISO(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
const TODAY=()=>isoDate(new Date());
function addDaysISO(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return isoDate(d);}
function addMonthsISO(s,n){const d=parseISO(s);const day=d.getDate();const r=new Date(d.getFullYear(),d.getMonth()+n,1);const dm=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(day,dm));return isoDate(r);}
const monthKey=s=>String(s).slice(0,7);
function monthAdd(k,n){const p=k.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
const monthStart=k=>k+'-01';
function monthEnd(k){const p=k.split('-').map(Number);return isoDate(new Date(p[0],p[1],0));}
const dim=k=>Number(monthEnd(k).slice(8));
const monthLabel=k=>{const p=k.split('-').map(Number);return MONS_F[p[1]-1]+' '+p[0];};

function defaultSettings(){return{
  currency:'PHP',dateFormat:'MMM d, yyyy',reportingPeriod:'month',
  warnThreshold:80,dangerThreshold:100,
  expenseCats:[
    {name:'Food & Dining',essential:false},{name:'Groceries',essential:true},{name:'Housing & Rent',essential:true},
    {name:'Utilities',essential:true},{name:'Transportation',essential:true},{name:'Healthcare',essential:true},
    {name:'Subscriptions',essential:false},{name:'Shopping',essential:false},{name:'Entertainment',essential:false},
    {name:'Debt Interest',essential:true},{name:'Personal Care',essential:false},{name:'Education',essential:true},
    {name:'Reconciliation',essential:true},{name:'Other',essential:false}],
  incomeCats:['Salary','Freelance','Business','Allowance','Investment Income','Other Income']};}
function blankState(){return{version:2,settings:defaultSettings(),accounts:[],transactions:[],budgets:[],recurring:[],goals:[],exceptions:[],dismissed:[],isDemo:false};}
function normalizeState(s){
  s=s||{};
  const st=Object.assign(defaultSettings(),s.settings||{});
  st.expenseCats=(Array.isArray(st.expenseCats)&&st.expenseCats.length)?st.expenseCats.map(c=>typeof c==='string'?{name:c,essential:false}:{name:String(c.name),essential:!!c.essential}):defaultSettings().expenseCats;
  st.incomeCats=(Array.isArray(st.incomeCats)&&st.incomeCats.length)?st.incomeCats.map(String):defaultSettings().incomeCats;
  st.warnThreshold=clamp(toNum(st.warnThreshold)||80,1,100);
  st.dangerThreshold=clamp(toNum(st.dangerThreshold)||100,1,200);
  if(!['MMM d, yyyy','dd MMM yyyy','yyyy-MM-dd','MM/dd/yyyy'].includes(st.dateFormat))st.dateFormat='MMM d, yyyy';
  if(!['month','prev','ytd','custom'].includes(st.reportingPeriod))st.reportingPeriod='month';
  const out=blankState();out.settings=st;
  out.accounts=(s.accounts||[]).map(a=>({id:String(a.id||'')||uid(),name:String(a.name||'Account').trim(),type:normAccType(a.type),openingBalance:toNum(a.openingBalance),openingDate:normDate(a.openingDate)||TODAY(),notes:String(a.notes||''),archived:toBool(a.archived),apr:(a.apr==null||a.apr==='')?null:toNum(a.apr),minPayment:toNum(a.minPayment),dueDay:toNum(a.dueDay)?clamp(Math.round(toNum(a.dueDay)),1,31):null,plannedPayment:toNum(a.plannedPayment)}));
  out.transactions=(s.transactions||[]).map(t=>{const type=normTxnType(t.type);const mv=(type==='transfer'||type==='cc_payment');
    return{id:String(t.id||'')||uid(),date:normDate(t.date)||TODAY(),type:type,description:String(t.description||''),amount:Math.abs(toNum(t.amount)),
      category:mv?'':(String(t.category||'').trim()||(type==='income'?'Other Income':'Other')),
      fromAccount:t.fromAccount||null,toAccount:t.toAccount||null,method:String(t.method||''),notes:String(t.notes||''),
      tags:Array.isArray(t.tags)?t.tags:(t.tags?String(t.tags).split(';').map(x=>x.trim()).filter(Boolean):[]),
      recurringId:t.recurringId||null,refundOf:t.refundOf||null};});
  out.budgets=(s.budgets||[]).map(b=>{const m=String(b.month||'').trim();const bc=String(b.category||'').trim();
    return{id:String(b.id||'')||uid(),month:/^\d{4}-\d{2}/.test(m)?m.slice(0,7):((normDate(m)||TODAY()).slice(0,7)),
      category:/^(__total__|overall total|overall|total)$/i.test(bc)?'__total__':(bc||'Other'),amount:toNum(b.amount),scope:String(b.scope||'').toLowerCase()==='weekly'?'weekly':'monthly'};});
  out.recurring=(s.recurring||[]).map(r=>({id:String(r.id||'')||uid(),description:String(r.description||''),type:String(r.type||'').toLowerCase()==='income'?'income':'expense',amount:Math.abs(toNum(r.amount)),category:String(r.category||'').trim()||'Other',account:r.account||null,startDate:normDate(r.startDate)||TODAY(),endDate:normDate(r.endDate),freq:normFreq(r.freq),nextDue:normDate(r.nextDue),status:String(r.status||'').toLowerCase()==='paused'?'paused':'active'}));
  out.goals=(s.goals||[]).map(g=>({id:String(g.id||'')||uid(),name:String(g.name||'Goal'),target:toNum(g.target),saved:toNum(g.saved),targetDate:normDate(g.targetDate),monthlyContribution:toNum(g.monthlyContribution)}));
  out.exceptions=Array.isArray(s.exceptions)?s.exceptions:[];

  for(const r of out.recurring){

/* ---------------- Ledger calculations ---------------- */
const accountById=id=>state.accounts.find(a=>a.id===id);
const isLiab=a=>a&&LIABS.includes(a.type);
function accountBalance(id,cutoff){
  const acc=accountById(id);if(!acc)return 0;
  let b=0;
  if(!cutoff||!acc.openingDate||acc.openingDate<=cutoff)b=acc.openingBalance||0;
  const liab=isLiab(acc);
  for(const t of state.transactions){
    if(cutoff&&t.date>cutoff)continue;
    if(t.type==='income'&&t.toAccount===id)b+=liab?-t.amount:t.amount;
    else if(t.type==='refund'&&t.toAccount===id)b+=liab?-t.amount:t.amount;
    else if(t.type==='expense'&&t.fromAccount===id)b+=liab?t.amount:-t.amount;
    else if(t.type==='transfer'||t.type==='cc_payment'){
      if(t.fromAccount===id)b+=liab?t.amount:-t.amount;
      if(t.toAccount===id)b+=liab?-t.amount:t.amount;
    }
  }
  return round2(b);
}
const availableCash=cutoff=>state.accounts.filter(a=>!a.archived&&ASSETS.includes(a.type)).reduce((s,a)=>s+accountBalance(a.id,cutoff),0);
const totalDebt=cutoff=>state.accounts.filter(a=>!a.archived&&LIABS.includes(a.type)).reduce((s,a)=>s+accountBalance(a.id,cutoff),0);
const txnsIn=(from,to)=>state.transactions.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to));
const monthTxns=k=>txnsIn(monthStart(k),monthEnd(k));
const sumBy=(tx,type)=>round2(tx.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0));
function periodSummary(tx){const income=sumBy(tx,'income'),gross=sumBy(tx,'expense'),refunds=sumBy(tx,'refund');
  return{income:income,gross:gross,refunds:refunds,netExpense:round2(gross-refunds),net:round2(income-gross+refunds),
    savingsRate:income>0?round2((income-gross+refunds)/income*100):null};}
function netSpendByCat(tx){const m={};for(const t of tx){if(t.type==='expense')m[t.category]=round2((m[t.category]||0)+t.amount);else if(t.type==='refund')m[t.category]=round2((m[t.category]||0)-t.amount);}return m;}
function allMonths(){const set=new Set(state.transactions.map(t=>monthKey(t.date)));set.add(monthKey(TODAY()));return[...set].sort();}
function avgNetCashflow(months){const cur=monthKey(TODAY());const keys=allMonths().filter(k=>k<cur).slice(-months);if(!keys.length)return null;
  let net=0;for(const k of keys)net+=periodSummary(monthTxns(k)).net;return round2(net/keys.length);}

/* ---------------- Recurring schedules ---------------- */
function stepFreq(r,iso){
  if(r.freq==='weekly')return addDaysISO(iso,7);
  if(r.freq==='biweekly')return addDaysISO(iso,14);
  let m=1;if(r.freq==='quarterly')m=3;if(r.freq==='annually')m=12;
  const p=parseISO(iso),anchor=Number(String(r.startDate||iso).slice(8))||p.getDate();
  const nm=new Date(p.getFullYear(),p.getMonth()+m,1);
  const dd=new Date(nm.getFullYear(),nm.getMonth()+1,0).getDate();
  return isoDate(new Date(nm.getFullYear(),nm.getMonth(),Math.min(anchor,dd)));
}
function occBetween(r,fromISO,toISO){
  const out=[];let cur=r.startDate,g=0;
  while(cur<=toISO&&g<3000){
    if(cur>=fromISO&&(!r.endDate||cur<=r.endDate))out.push(cur);
    cur=stepFreq(r,cur);g++;
  }
  return out;
}
const postedOn=(rid,date)=>state.transactions.some(t=>t.recurringId===rid&&t.date===date);
function advanceRecurring(r,paidDate){
  if(!r.nextDue)return;let g=0;
  while(r.nextDue<=paidDate&&g<600){r.nextDue=stepFreq(r,r.nextDue);g++;}
}
const overdueBills=()=>state.recurring.filter(r=>r.status==='active'&&r.nextDue&&r.nextDue<TODAY()&&(!r.endDate||r.nextDue<=r.endDate));
function dueSoon(days){const out=[];const to=addDaysISO(TODAY(),days);
  for(const r of state.recurring){if(r.status!=='active'||!r.nextDue)continue;
    for(const d of occBetween(r,TODAY(),to)){if(d>=r.nextDue&&!postedOn(r.id,d))out.push({r:r,date:d});}}
  return out;}

/* ---------------- Budgets ---------------- */
const budgetsFor=k=>state.budgets.filter(b=>b.month===k);
function totalBudget(k){const t=state.budgets.find(b=>b.month===k&&b.scope==='monthly'&&b.category==='__total__');
  return t?t.amount:budgetsFor(k).filter(b=>b.scope==='monthly'&&b.category!=='__total__').reduce((s,b)=>s+b.amount,0);}
function budgetStatus(spent,amount){
  if(!(amount>0))return spent>0?{cls:'b-mut',label:'No budget'}:{cls:'b-mut',label:'\u2014'};
  const p=spent/amount*100;
  if(p>=state.settings.dangerThreshold)return{cls:'b-over',label:'Over budget'};
  if(p>=state.settings.warnThreshold)return{cls:'b-watch',label:'Approaching'};
  return{cls:'b-ok',label:'On track'};
}

/* ---------------- Forecast ---------------- */
function categoryBaseline(){
  const cur=monthKey(TODAY());
  const keys=allMonths().filter(k=>k<cur).slice(-3);
  const out={__months:keys.length};
  const pick=k=>monthTxns(k).filter(t=>(t.type==='expense'||t.type==='refund')&&!t.recurringId&&!state.exceptions.includes(t.id));
  if(!keys.length){
    const m=netSpendByCat(pick(cur));for(const c in m)if(m[c]>0)out[c]=m[c];
    out.__limited=true;return out;
  }
  for(const k of keys){const m=netSpendByCat(pick(k));for(const c in m)out[c]=round2((out[c]||0)+m[c]);}
  for(const k in out){if(!k.startsWith('__'))out[k]=round2(out[k]/keys.length);}
  return out;
}
function estimateCategoryRemainder(cat){
  const today=TODAY(),k=monthKey(today),D=dim(k),dom=Number(today.slice(8));
  const remaining=D-dom;if(remaining<=0)return 0;
  const avg=categoryBaseline()[cat]||0;
  const cur=netSpendByCat(monthTxns(k))[cat]||0;
  const pace=cur/Math.max(dom,1)*D;
  return round2(Math.max(0,0.5*avg+0.5*pace)/D*remaining);
}
function computeForecast(horizon,sc){
  sc=sc||{incomePct:0,diningCut:0,oneTime:0,oneTimeWhen:1,monthlyAdj:0};
  const today=TODAY(),startKey=monthKey(today),endKey=monthAdd(startKey,horizon-1),endISO=monthEnd(endKey);
  const cash0=availableCash();
  const base=categoryBaseline();
  const events=[],dayDelta={},balAfter={},mk={};
  const add=(d,amt)=>{dayDelta[d]=round2((dayDelta[d]||0)+amt);};
  const bucket=(k,f,amt)=>{if(!mk[k])mk[k]={income:0,bills:0,variable:0};mk[k][f]=round2(mk[k][f]+amt);};
  let incomeRem=0,billsRem=0,variableRem=0;
  for(const r of state.recurring){
    if(r.status!=='active')continue;
    for(const D of occBetween(r,today,endISO)){
      if(postedOn(r.id,D)||(r.nextDue&&D<r.nextDue))continue;
      const k=monthKey(D);
      if(r.type==='income'){
        const amt=round2(r.amount*(1+(sc.incomePct||0)/100));
        add(D,amt);bucket(k,'income',amt);incomeRem+=amt;
        events.push({date:D,label:r.description,amt:amt,kind:'income'});
      }else{
        const acc=accountById(r.account);
        if(isLiab(acc)){events.push({date:D,label:r.description+' (billed to '+acc.name+' \u2014 no cash outflow now)',amt:r.amount,kind:'card'});}
        else{add(D,-r.amount);bucket(k,'bills',r.amount);billsRem+=r.amount;
          events.push({date:D,label:r.description,amt:-r.amount,kind:'bill'});}
      }
    }
  }
  const dining='Food & Dining';
  for(const cat in base){
    if(cat.indexOf('__')===0)continue;
    let avg=base[cat];if(cat===dining)avg=avg*(1-(sc.diningCut||0)/100);
    if(!(avg>0))continue;
    const D0=dim(startKey),dom0=Number(today.slice(8));
    const daily=avg/D0;
    for(let d=Math.max(1,dom0);d<=D0;d++){const iso=startKey+'-'+String(d).padStart(2,'0');if(iso>=today){add(iso,-daily);bucket(startKey,'variable',daily);}}
    for(let m=1;m<horizon;m++){const k=monthAdd(startKey,m),dd=dim(k),dm=avg/dd;
      for(let d=1;d<=dd;d++){add(k+'-'+String(d).padStart(2,'0'),-dm);bucket(k,'variable',dm);}}
  }
  variableRem=0;for(const k in mk)variableRem+=mk[k].variable;
  if(sc.oneTime>0){
    const k=monthAdd(startKey,Math.max(0,(sc.oneTimeWhen||1)-1));
    let d=addDaysISO(monthStart(k),Math.min(14,dim(k)-1));
    if(d<=today)d=addDaysISO(today,1);
    add(d,-sc.oneTime);bucket(monthKey(d),'bills',sc.oneTime);
    events.push({date:d,label:'Planned purchase (what-if scenario)',amt:-sc.oneTime,kind:'scenario'});
  }
  if(sc.monthlyAdj){
    for(let m=0;m<horizon;m++){const k=monthAdd(startKey,m);
      let d=(m===0?addDaysISO(today,1):k+'-05');
      if(d>endISO)continue;
      add(d,-sc.monthlyAdj);bucket(monthKey(d),'bills',sc.monthlyAdj);
      events.push({date:d,label:'Monthly set-aside adjustment (what-if)',amt:-sc.monthlyAdj,kind:'scenario'});}
  }
  const labels=[],series=[];let bal=cash0;
  labels.push(fmtDShort(today)+' (now)');series.push(round2(cash0));
  let firstNeg=null,minBal=cash0,minDate=today;
  for(let d=addDaysISO(today,1);d<=endISO;d=addDaysISO(d,1)){
    bal=round2(bal+(dayDelta[d]||0));
    labels.push(fmtDShort(d));series.push(bal);balAfter[d]=bal;
    if(bal<0&&!firstNeg)firstNeg={date:d,amount:bal};
    if(bal<minBal){minBal=bal;minDate=d;}
  }
  const months=[];let cum=cash0;
  for(let m=0;m<horizon;m++){const k=monthAdd(startKey,m);const b=mk[k]||{income:0,bills:0,variable:0};
    const net=round2(b.income-b.bills-b.variable);cum=round2(cum+net);
    months.push({k:k,income:b.income,bills:b.bills,variable:b.variable,net:net,end:cum});}
  const warnings=[];
  if(firstNeg){const nextInc=events.filter(e=>e.kind==='income'&&e.date>firstNeg.date)[0];
    warnings.push({level:'danger',text:'Projected available cash turns negative on '+fmtDate(firstNeg.date)+' ('+money(firstNeg.amount)+').'+(nextInc?' Next expected income after that: '+nextInc.label+' on '+fmtDate(nextInc.date)+'.':'')});}
  if(base.__limited)warnings.push({level:'warn',text:'Transaction history is limited, so variable-spending estimates lean on this month\u2019s pace only. They will improve as you record more months.'});
  const keys3=allMonths().filter(k=>k<startKey).slice(-3);
  if(keys3.length>=2){const tots=keys3.map(k=>periodSummary(monthTxns(k)).netExpense);
    const avg=tots.reduce((a,b)=>a+b,0)/tots.length;
    if(avg>0&&(Math.max.apply(null,tots)-Math.min.apply(null,tots))/avg>0.6)warnings.push({level:'warn',text:'Your monthly spending has been highly variable, so treat these projections as rough bounds rather than precise figures.'});}
  const explanations=[
    'Current available cash & deposits (from your ledger): '+money(cash0)+'.',
    'Expected income remaining (from active recurring schedules): '+money(incomeRem)+'.',
    'Confirmed scheduled bills & planned payments: '+money(billsRem)+'.',
    'Estimated variable spending ('+base.__months+'-month average, spread over remaining days): '+money(variableRem)+'.',
    'Projected ending cash: '+money(cash0)+' + '+money(incomeRem)+' \u2212 '+money(billsRem)+' \u2212 '+money(variableRem)+(sc.oneTime||sc.monthlyAdj?' \u2212 what-if items':'')+' = '+money(months[months.length-1].end)+'.'
  ];
  if(sc.incomePct)explanations.push('What-if applied: income '+(sc.incomePct>0?'+':'')+sc.incomePct+'%.');
  if(sc.diningCut)explanations.push('What-if applied: Food & Dining cut by '+sc.diningCut+'%.');
  events.sort((a,b)=>a.date<b.date?-1:1);
  return{cash0:cash0,labels:labels,series:series,events:events,months:months,balAfter:balAfter,incomeRem:incomeRem,billsRem:billsRem,variableRem:variableRem,
    projectedEnd:months[months.length-1].end,minBal:minBal,minDate:minDate,firstNeg:firstNeg,warnings:warnings,explanations:explanations,
    limited:!!base.__limited,horizon:horizon,endISO:endISO};
}

/* ---------------- Insights ---------------- */
function computeInsights(){
  const out=[],k=ui.month,today=TODAY();
  const cur=monthKey(today);
  const add=(key,level,title,body,actionHTML)=>{if(state.dismissed.includes(key))return;
    out.push({key:key,level:level,title:title,body:body,actionHTML:actionHTML||''});};
  const spendMap=netSpendByCat(monthTxns(k));
  for(const b of budgetsFor(k)){
    if(b.scope!=='monthly'||b.category==='__total__')continue;
    const spent=spendMap[b.category]||0;
    if(!(b.amount>0))continue;
    const p=spent/b.amount*100;
    const est=spent+(k===cur?estimateCategoryRemainder(b.category):0);
    if(p>=state.settings.dangerThreshold)
      add('bud:'+b.category+':'+k,'danger',b.category+' is over budget',money(spent)+' spent of '+money(b.amount)+' ('+pctStr(p)+').'+(k===cur?' Projected month-end: '+money(est)+'.':''),
        '<button class="btn btn-sm" data-act="drill" data-cat="'+esc(b.category)+'" data-from="'+monthStart(k)+'" data-to="'+monthEnd(k)+'">View transactions</button><button class="btn btn-sm" data-act="bud-edit" data-id="'+esc(b.id)+'">Adjust budget</button>');
    else if(p>=state.settings.warnThreshold)
      add('bud:'+b.category+':'+k,'warn',b.category+' is approaching its budget',pctStr(p)+' of '+money(b.amount)+' used ('+money(spent)+').'+(k===cur?' Projected month-end: about '+money(est)+'.':''),
        '<button class="btn btn-sm" data-act="drill" data-cat="'+esc(b.category)+'" data-from="'+monthStart(k)+'" data-to="'+monthEnd(k)+'">View transactions</button>');
    else if(est>0&&est<b.amount*0.9&&b.amount-est>=1000&&Number(today.slice(8))>=15&&k===cur)
      add('budok:'+b.category+':'+k,'good',b.category+' has unused budget',money(b.amount-est)+' looks likely to remain unspent (projected '+money(est)+' of '+money(b.amount)+'). Consider moving the surplus to a savings goal.',
        '<button class="btn btn-sm" data-act="nav" data-sec="goals">Go to goals</button>');
  }
  const base=categoryBaseline();
  if(!base.__limited){
    for(const cat in base){if(cat.indexOf('__')===0)continue;
      const spent=spendMap[cat]||0,avg=base[cat];
      if(avg>0&&spent>avg*1.5&&spent-avg>=1000)
        add('anom:'+cat+':'+k,'warn','Spending on '+cat+' is above your usual pace','This month: '+money(spent)+' vs a '+base.__months+'-month average of '+money(avg)+'. That is '+money(spent-avg)+' above baseline.',
          '<button class="btn btn-sm" data-act="drill" data-cat="'+esc(cat)+'" data-from="'+monthStart(k)+'" data-to="'+monthEnd(k)+'">Inspect transactions</button>');
    }
  }
  for(const r of overdueBills()){
    add('bill:'+r.id+':'+r.nextDue,'danger','Overdue: '+r.description,'Was due '+fmtDate(r.nextDue)+' ('+money(r.amount)+'). It has not been recorded as paid.',
      '<button class="btn btn-sm btn-primary" data-act="rec-paid" data-id="'+esc(r.id)+'">Mark as paid</button><button class="btn btn-sm" data-act="rec-skip" data-id="'+esc(r.id)+'">Skip</button>');
  }
  for(const e of dueSoon(5)){
    if(e.date<today)continue;
    const dd=relDays(e.date);
    const when=(dd===0?'today':(dd+' day(s) from now'));
    add('bill:'+e.r.id+':'+e.date,'info','Upcoming: '+e.r.description,
      money(e.r.amount)+' due '+fmtDate(e.date)+' ('+when+'), '+(e.r.type==='income'?'into ':'paid from ')+((accountById(e.r.account)||{name:'\u2014'}).name)+'.',
      '<button class="btn btn-sm btn-primary" data-act="rec-paid" data-id="'+esc(e.r.id)+'">'+(e.r.type==='income'?'Mark as received':'Mark as paid')+'</button>');
  }
  const fc=computeForecast(1);
  if(fc.firstNeg)
    add('fc:neg:'+cur,'danger','Projected cash may fall short','Based on current balances, schedules and estimated spending, available cash may go negative around '+fmtDate(fc.firstNeg.date)+'. Review the Forecast section.',
      '<button class="btn btn-sm" data-act="nav" data-sec="forecast">Open forecast</button>');
  const cf=avgNetCashflow(3);
  for(const g of state.goals){
    if(!g.targetDate||g.target<=0)continue;
    const monthsLeft=Math.max(1,Math.round((parseISO(g.targetDate)-parseISO(today))/(30.44*86400000)));
    const need=round2(Math.max(0,g.target-g.saved)/monthsLeft);
    if(need>0&&cf!=null&&cf>0&&need>cf)
      add('goal:'+g.id+':'+cur,'warn','Goal "'+g.name+'" needs more than your cash flow allows','Requires about '+money(need)+'/month for '+monthsLeft+' months, but your average net cash flow is '+money(cf)+'/month. Consider extending the target date or lowering the target.',
        '<button class="btn btn-sm" data-act="goal-edit" data-id="'+esc(g.id)+'">Adjust goal</button>');
  }
  if(base['Subscriptions']>0||spendMap['Subscriptions']>0){
    const per=spendMap['Subscriptions']||base['Subscriptions']||0;
    const ann=round2(per*12);
    if(ann>=6000)add('sub:annual','info','Subscriptions cost about '+money(ann)+' per year','Based on roughly '+money(per)+' per month. Worth reviewing which ones you actually use.',
      '<button class="btn btn-sm" data-act="drill" data-cat="Subscriptions">See subscriptions</button>');
  }
  const recent=state.transactions.filter(t=>t.date>=addDaysISO(today,-60));
  const seen={},dups=[];
  for(const t of recent){
    if(t.type==='transfer')continue;
    const key=t.date+'|'+round2(t.amount)+'|'+t.description.toLowerCase().trim();
    if(seen[key]){if(!state.exceptions.includes(t.id)&&!state.exceptions.includes(seen[key].id))dups.push([seen[key],t]);}
    else seen[key]=t;
  }
  dups.slice(0,3).forEach(p=>add('dup:'+p[0].id+':'+p[1].id,'warn','Possible duplicate transaction','"'+p[1].description+'" ('+money(p[1].amount)+') appears twice on '+fmtDate(p[1].date)+'. Not fraud \u2014 just a possible double entry.',
    '<button class="btn btn-sm" data-act="txn-view" data-id="'+esc(p[1].id)+'">Review</button><button class="btn btn-sm btn-ghost" data-act="anom-except" data-id="'+esc(p[1].id)+'">It\u2019s not a duplicate</button>'));
  return out;
}

/* ---------------- Charts (local SVG) ---------------- */
const CPL=54,CPR=14,CPT=14,CPB=30;
const nochart=msg=>'<div class="nochart">'+esc(msg||'Not enough data to chart yet.')+'</div>';
function svgLine(o){
  const w=o.w||720,h=o.h||230,labels=o.labels||[],series=o.series||[],fmtY=o.fmtY||money0;
  const n=labels.length;

  let guide='';
  if(o.guide)guide='<line class="guide" x1="0" y1="'+CPT+'" x2="0" y2="'+(h-CPB)+'" stroke="#e08a3c" stroke-width="1" opacity="0" stroke-dasharray="3 3"/>';
  for(const s of series){
    const pts=s.data.map(function(v,i){return v==null?null:[X(i),Y(v)];});

    pts.forEach(function(p){if(p){d+=(open?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);open=true;}else open=false;});
    if(s.area&&pts.length>1&&pts.every(function(p){return !!p;})){
      let a='M'+pts[0][0].toFixed(1)+' '+Y(Math.max(min,0)).toFixed(1);
      pts.forEach(function(p){a+='L'+p[0].toFixed(1)+' '+p[1].toFixed(1);});
      a+='L'+pts[pts.length-1][0].toFixed(1)+' '+Y(Math.max(min,0)).toFixed(1)+'Z';
      out+='<path d="'+a+'" fill="'+s.color+'" opacity="0.1"/>';
    }
    out+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.4"'+(s.dashed?' stroke-dasharray="6 4"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    if(pts.length<=42)pts.forEach(function(p,i){if(p)out+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="'+s.color+'" class="chov"><title>'+esc(labels[i])+': '+esc((s.tipFmt||money)(s.data[i]))+'</title></circle>';});
  }
  out+=guide;
  if(o.markers)for(const m of o.markers){const i=labels.indexOf(m.label);if(i>=0)out+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(m.value).toFixed(1)+'" r="4.5" fill="'+(m.color||'#e08a3c')+'" stroke="#fff" stroke-width="1.5"><title>'+esc(m.title)+'</title></circle>';}
  out+='</svg>';
  return out;
}
function svgBars(o){

    });

function svgDonut(items,o){

  const total=items.reduce(function(s,x){return s+Math.max(0,x.value);},0);
  if(!(total>0))return nochart(o.emptyMsg);
  const r=(size-thick)/2,c=size/2,circ=2*Math.PI*r;let off=0;
  let out='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img">';
  items.forEach(function(x){
    if(!(x.value>0))return;
    const frac=x.value/total,len=frac*circ;
    out+='<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+x.color+'" stroke-width="'+thick+'" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+c+' '+c+')" class="chov"><title>'+esc(x.label)+': '+esc(money(x.value))+' ('+pctStr(frac*100)+')</title></circle>';
    off+=len;
  });
  out+='<text x="'+c+'" y="'+(c-3)+'" text-anchor="middle" style="font-weight:800;font-size:15px;fill:#182635">'+esc(o.center||'')+'</text>';
  out+='<text x="'+c+'" y="'+(c+15)+'" text-anchor="middle" class="ct">'+esc(o.centerSub||'')+'</text></svg>';
  return out;
}
function attachHover(wrapId,labels,series){
  const wrap=document.getElementById(wrapId);if(!wrap)return;
  const svg=wrap.querySelector('svg.chart');if(!svg)return;
  const g=svg.querySelector('.guide');
  let tip=wrap.querySelector('.chart-tip');
  if(!tip){tip=document.createElement('div');tip.className='chart-tip';wrap.appendChild(tip);}
  svg.onmousemove=function(e){
    const r=svg.getBoundingClientRect(),vw=svg.viewBox.baseVal.width;
    const iw=vw-CPL-CPR,n=labels.length;if(n<1)return;
    let i=Math.round(((e.clientX-r.left)/r.width*vw-CPL)/iw*(n-1));i=clamp(i,0,n-1);
    const px=CPL+i*iw/Math.max(1,n-1);
    if(g){g.setAttribute('x1',px);g.setAttribute('x2',px);g.setAttribute('opacity','1');}
    let rows='';for(const s of series){const v=s.data[i];
      rows+='<div class="row"><span><span class="dot" style="background:'+s.color+'"></span>'+esc(s.name)+'</span><b>'+money(v==null?0:v)+'</b></div>';}
    tip.innerHTML='<b>'+esc(labels[i])+'</b>'+rows;
    tip.style.display='block';
    const wr=wrap.getBoundingClientRect();
    tip.style.left=clamp((px/vw*r.width)+12,4,Math.max(4,wr.width-150))+'px';
    tip.style.top='4px';
  };
  svg.onmouseleave=function(){tip.style.display='none';if(g)g.setAttribute('opacity','0');};
}
function sparkline(vals,color){
  const pts=vals.map(function(v,i){return [i,v];}).filter(function(p){return p[1]!=null;});
  if(pts.length<2)return '<span class="week-chip">no history</span>';
  const min=Math.min.apply(null,pts.map(function(p){return p[1];})),max=Math.max.apply(null,pts.map(function(p){return p[1];}));
  const Y=v=>max===min?12:18-(v-min)/(max-min)*16;
  let d='';pts.forEach(function(p,i){d+=(i?'L':'M')+(i/(pts.length-1)*76).toFixed(1)+' '+Y(p[1]).toFixed(1);});
  return '<svg width="80" height="26" viewBox="0 0 76 26"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8"/></svg>';
}

/* ---------- Debt ---------- */
function payoffEstimate(bal,apr,monthly){
  if(!(monthly>0)||bal<=0)return null;
  const r=apr>0?apr/100/12:0;
  if(r>0){if(monthly<=bal*r)return{ok:false,reason:'Payment does not cover the monthly interest.'};
    const n=Math.log(monthly/(monthly-r*bal))/Math.log(1+r);
    return{ok:true,months:Math.ceil(n),interest:round2(monthly*n-bal)};}
  return{ok:true,months:Math.ceil(bal/monthly),interest:0};
}

/* ---------- Accounts ---------- */
RENDER.accounts=function(){
  const assets=state.accounts.filter(function(a){return ASSETS.includes(a.type);});
  const liabs=state.accounts.filter(function(a){return LIABS.includes(a.type);});
  const cash=availableCash(),debt=totalDebt();
  const cur=monthKey(TODAY());
  const accCard=function(a){
    const bal=accountBalance(a.id);
    const n=state.transactions.filter(function(t){return t.fromAccount===a.id||t.toAccount===a.id;}).length;
    const trend=[];for(let i=5;i>=0;i--){const k=monthAdd(cur,-i);trend.push(k===cur?bal:accountBalance(a.id,monthEnd(k)));}
    const balCol=isLiab(a)?(bal>0?'var(--red)':'var(--teal)'):(bal>=0?'var(--ink)':'var(--red)');
    const balLbl=isLiab(a)?(bal>0?'owed':'nothing owed'):(bal>=0?'available':'negative balance');
    return '<div class="panel" style="margin-bottom:12px'+(a.archived?';opacity:.65':'')+'"><div class="panel-body" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">'+
    '<div style="flex:1;min-width:180px"><h3>'+esc(a.name)+(a.archived?' <span class="badge b-mut">archived</span>':'')+'</h3>'+
    '<div style="font-size:12px;color:var(--muted)">'+ACC_LBL[a.type]+' \u00b7 opened '+fmtDate(a.openingDate)+' \u00b7 '+n+' transaction(s)'+(a.notes?(' \u00b7 '+esc(a.notes)):'')+'</div></div>'+
    '<div style="text-align:right;min-width:150px"><div class="num" style="font-size:22px;font-weight:800;color:'+balCol+'">'+money(Math.abs(bal))+'</div>'+
    '<div style="font-size:11.5px;color:var(--muted)">'+balLbl+'</div></div>'+
    '<div style="text-align:center">'+sparkline(trend,isLiab(a)?'#d5475e':'#0f9d8f')+'<div style="font-size:10.5px;color:var(--muted)">6-mo trend</div></div>'+
    '<div class="split-btns">'+
    '<button class="btn btn-sm" data-act="acc-hist" data-id="'+esc(a.id)+'">'+I('list',14)+' History</button>'+
    '<button class="btn btn-sm" data-act="acc-recon" data-id="'+esc(a.id)+'">'+I('check',14)+' Reconcile</button>'+
    '<button class="btn btn-sm" data-act="acc-edit" data-id="'+esc(a.id)+'">'+I('edit',14)+' Edit</button>'+
    '<button class="btn btn-sm" data-act="acc-arch" data-id="'+esc(a.id)+'">'+(a.archived?'Restore':'Archive')+'</button>'+
    (n===0?'<button class="icon-btn danger" data-act="acc-del" data-id="'+esc(a.id)+'" title="Delete (no transactions)">'+I('trash',15)+'</button>':'')+
    '</div></div></div>';};
  return '<div class="panel" style="margin-bottom:16px"><div class="panel-body"><div class="statrail">'+
  '<div class="stat"><div class="lb">Available cash & deposits</div><div class="vl num pos">'+money(cash)+'</div></div>'+
  '<div class="stat"><div class="lb">of which savings</div><div class="vl num">'+money(round2(assets.filter(function(a){return a.type==='savings'&&!a.archived;}).reduce(function(s,a){return s+accountBalance(a.id);},0)))+'</div></div>'+
  '<div class="stat"><div class="lb">Credit card debt</div><div class="vl num neg">'+money(round2(liabs.filter(function(a){return a.type==='credit'&&!a.archived;}).reduce(function(s,a){return s+accountBalance(a.id);},0)))+'</div></div>'+
  '<div class="stat"><div class="lb">Loans</div><div class="vl num neg">'+money(round2(liabs.filter(function(a){return a.type==='loan'&&!a.archived;}).reduce(function(s,a){return s+accountBalance(a.id);},0)))+'</div></div>'+
  '<div class="stat"><div class="lb">Net position</div><div class="vl num '+(cash-debt>=0?'pos':'neg')+'">'+money(cash-debt)+'</div></div>'+
  '</div></div></div>'+
  (assets.length?('<div class="subhead" style="margin:18px 4px 10px">Assets</div>'+assets.map(accCard).join('')):'')+
  (liabs.length?('<div class="subhead" style="margin:18px 4px 10px">Liabilities</div>'+liabs.map(accCard).join('')):'')+
  (!state.accounts.length?'<div class="panel" style="margin-bottom:12px"><div class="empty">'+I('wallet',30)+'<br><b>No accounts yet.</b><br>Start with your bank, cash wallet or GCash.</div></div>':'')+
  '<button class="btn btn-primary" data-act="acc-add">'+I('plus',15)+' Add account</button>'+
  '<div class="note" style="margin-top:14px">Balances are always <b>opening balance + transactions</b>, so editing or deleting a transaction cleanly updates every balance. \u201cReconcile\u201d compares with your bank statement and records any difference as a visible adjustment.</div>';
};

function openTxnModal(t,pref){

  '<div class="field"><label>Date</label><input type="date" class="inp" id="tDate" value="'+esc(t.date)+'" required></div>'+

    Array.from(new Set(state.transactions.slice(-200).map(function(x){return x.description;}))).slice(0,60).map(function(d){return '<option value="'+esc(d)+'">';}).join('')+'</datalist></div>'+
  '<div class="fgrid">'+

  '</div>'+

  '</div>'+

  '<div class="fgrid">'+

  '<div class="field"><label>Tags (optional, separate with ;)</label><input class="inp" id="tTags" value="'+esc(Array.isArray(t.tags)?t.tags.join('; '):'')+'" placeholder="work; reimbursable"></div>'+
  '</div>'+
  '<div class="field"><label>Notes (optional)</label><textarea class="inp" id="tNotes">'+esc(t.notes||'')+'</textarea></div>'+
  '<div class="note" id="tHelp"></div>'+
  '</form>',
  foot:(isNew?'':'<button class="btn btn-danger" data-act="txn-del" data-id="'+esc(t.id)+'" style="margin-right:auto">'+I('trash',15)+' Delete</button>')+'<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="tSave">'+(isNew?'Add transaction':'Save changes')+'</button>',
  onMount:function(){
    const HELP={income:'Money coming in (salary, freelance\u2026). Counts as income.',expense:'Money going out. Paid with a credit card? Pick the card \u2014 it adds to what you owe.',transfer:'Moving your own money between accounts (e.g. bank \u2192 GCash). Not income or expense.',cc_payment:'Paying off a credit card or loan from a cash account. Reduces debt; not counted as a new expense.',refund:'Money returned to you. Reduces spending in that category.'};
    const draw=function(){
      const type=$('#tType').value;
      const cats=type==='income'?state.settings.incomeCats:state.settings.expenseCats.map(function(c){return c.name;});
      const curCat=$('#tCat').value||t.category;
      $('#tCat').innerHTML=cats.map(function(c){return '<option value="'+esc(c)+'"'+(c===curCat?' selected':'')+'>'+esc(c)+'</option>';}).join('');

      const assetL=live.filter(function(a){return ASSETS.includes(a.type);});
      const curFrom=$('#tFrom').value||t.fromAccount,curTo=$('#tTo').value||t.toAccount;
      let fromList='',toList='',lF='From account',lT='To account',showF=true,showT=true;
      if(type==='income'){showF=false;lT='Deposit to';toList=accOptions(assetL,curTo);}
      else if(type==='expense'){lF='Paid with';fromList=accOptions(live.filter(function(a){return ASSETS.includes(a.type)||a.type==='credit';}),curFrom);showT=false;}
      else if(type==='refund'){showF=false;lT='Money returns to';toList=accOptions(live.filter(function(a){return ASSETS.includes(a.type)||a.type==='credit';}),curTo);}
      else if(type==='transfer'){fromList=accOptions(assetL,curFrom);toList=accOptions(live,curTo);}
      else{lF='Pay from (cash account)';fromList=accOptions(assetL,curFrom);lT='Card / loan being paid';toList=accOptions(live.filter(function(a){return LIABS.includes(a.type);}),curTo);}
      $('#fFrom').style.display=showF?'':'none';$('#fTo').style.display=showT?'':'none';
      $('#tFrom').innerHTML='<option value="">\u2014 select \u2014</option>'+fromList;
      $('#tTo').innerHTML='<option value="">\u2014 select \u2014</option>'+toList;
      $('#lFrom').textContent=lF;$('#lTo').textContent=lT;
      $('#tHelp').textContent=HELP[type];
    };
    $('#tType').addEventListener('change',draw);
    draw();
    $('#fTxn').addEventListener('submit',function(e){e.preventDefault();$('#tSave').click();});
    $('#tSave').addEventListener('click',function(){
      const type=$('#tType').value,date=$('#tDate').value,desc=$('#tDesc').value.trim();
      const amount=round2(parseFloat($('#tAmt').value));
      const cat=$('#tCat').value||'Other',from=$('#tFrom').value||null,to=$('#tTo').value||null;
      const errs=[];
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date))errs.push('Pick a date.');
      if(!desc)errs.push('Type a description or merchant.');
      if(!isFinite(amount)||amount<=0)errs.push('Amount must be more than zero.');
      if(amount>1e12)errs.push('That amount looks too large.');
      const fa=accountById(from),ta=accountById(to);
      if(type==='income'&&(!ta||!ASSETS.includes(ta.type)))errs.push('Choose which account the money went into.');
      if(type==='expense'&&!fa)errs.push('Choose the account or card used.');
      if(type==='refund'&&!ta)errs.push('Choose the account the money returns to.');
      if(type==='transfer'){
        if(!fa||!ASSETS.includes(fa.type))errs.push('Choose the account the money comes from.');
        if(!ta)errs.push('Choose the account the money goes to.');
        if(from&&from===to)errs.push('From and To must be different accounts.');
      }
      if(type==='cc_payment'){
        if(!fa||!ASSETS.includes(fa.type))errs.push('Choose the cash account you paid from.');
        if(!ta||!LIABS.includes(ta.type))errs.push('Choose the card or loan being paid.');
      }
      const errEl=$('#fTxnErr');
      if(errs.length){errEl.innerHTML=errs.map(esc).join('<br>');errEl.classList.add('show');return;}
      errEl.classList.remove('show');
      const tags=$('#tTags').value.split(';').map(function(x){return x.trim();}).filter(Boolean);
      const recId=t.recurringId||null;
      const obj={id:t.id||uid(),date:date,type:type,description:desc,amount:amount,
        category:(type==='transfer'||type==='cc_payment')?'':cat,
        fromAccount:(type==='income'||type==='refund')?null:from,
        toAccount:(type==='expense')?null:to,
        method:$('#tMethod').value,notes:$('#tNotes').value.trim(),tags:tags,
        refundOf:(type==='refund'?($('#tRefOf').value||null):null),recurringId:recId};
      mutate(function(){
        if(isNew)state.transactions.push(obj);
        else{const i=state.transactions.findIndex(function(x){return x.id===obj.id;});if(i>=0)state.transactions[i]=obj;else state.transactions.push(obj);}
        if(recId&&isNew){const r=state.recurring.find(function(x){return x.id===recId;});if(r)advanceRecurring(r,obj.date);}
      });
      closeModal();
      toast((isNew?'Added':'Updated')+' \u201c'+desc+'\u201d ('+money(amount)+')','ok');
    });
  }});
}

let pendingImport=null;
function importCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2){toast('The CSV file has no data rows.','err');return;}
  const norm=function(s){return String(s||'').toLowerCase().replace(/[\s_]+/g,'');};
  const head=rows[0].map(norm);
  const col={};['date','description','amount','type','category','fromaccount','toaccount','account','method','notes','tags'].forEach(function(k){col[k]=head.indexOf(k);});
  ['merchant','desc','details'].forEach(function(alt){if(col.description<0&&head.indexOf(alt)>=0)col.description=head.indexOf(alt);});
  ['from','source'].forEach(function(alt){if(col.fromaccount<0&&head.indexOf(alt)>=0)col.fromaccount=head.indexOf(alt);});
  ['to','destination'].forEach(function(alt){if(col.toaccount<0&&head.indexOf(alt)>=0)col.toaccount=head.indexOf(alt);});
  if(col.date<0||col.description<0||col.amount<0){toast('The CSV needs at least date, description and amount columns.','err');return;}
  const get=function(r,i){return (i>=0&&i<r.length)?String(r[i]).trim():'';};
  const accByName=function(v){if(!v)return null;const a=state.accounts.find(function(x){return x.name.toLowerCase()===v.toLowerCase();});return a?a.id:null;};
  const parsed=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];const date=normDate(get(r,col.date));const desc=get(r,col.description);
    const amount=toNum(get(r,col.amount));
    const rawType=get(r,col.type);
    const type=rawType?normTxnType(rawType):(amount<0?'expense':'expense');
    let status='ok',reason='';
    if(!date){status='error';reason='invalid date';}
    else if(!desc){status='error';reason='missing description';}
    else if(!isFinite(amount)||amount===0){status='error';reason='invalid amount';}
    else if(state.transactions.some(function(t){return t.date===date&&Math.abs(t.amount-Math.abs(amount))<0.01&&t.description.toLowerCase()===desc.toLowerCase();})){status='duplicate';reason='already exists';}
    parsed.push({date:date,desc:desc,amount:Math.abs(amount),type:type,category:get(r,col.category),
      from:(accByName(get(r,col.fromaccount))||accByName(get(r,col.account))),
      to:accByName(get(r,col.toaccount)),method:get(r,col.method),notes:get(r,col.notes),tags:get(r,col.tags),
      status:status,reason:reason,line:i+1});
  }
  const okN=parsed.filter(function(p){return p.status==='ok';}).length;
  const dupN=parsed.filter(function(p){return p.status==='duplicate';}).length;
  const errN=parsed.filter(function(p){return p.status==='error';}).length;
  pendingImport=parsed;
  openModal({wide:true,title:'Preview import',body:
  '<div class="note" style="margin-bottom:12px">'+parsed.length+' row(s): <b class="pos">'+okN+' ready</b>, '+dupN+' possible duplicate(s) (unticked \u2014 tick to import anyway), '+errN+' invalid (skipped). Unknown categories become \u201cOther\u201d; accounts are matched by name.</div>'+
  '<div class="table-scroll" style="max-height:340px;overflow-y:auto"><table class="tbl"><thead><tr><th></th><th>Line</th><th>Date</th><th>Type</th><th>Description</th><th class="r">Amount</th><th>Category</th><th>Status</th></tr></thead><tbody>'+
  parsed.map(function(p){
    const box=(p.status==='error'?'':'<input type="checkbox" class="impRow" data-line="'+p.line+'"'+(p.status==='ok'?' checked':'')+'>');
    const stat=(p.status==='ok'?'<span class="badge b-ok">ready</span>':(p.status==='duplicate'?('<span class="badge b-watch">'+esc(p.reason)+'</span>'):('<span class="badge b-over">'+esc(p.reason)+'</span>')));
    return '<tr><td>'+box+'</td><td>'+p.line+'</td><td class="num">'+esc(p.date||'\u2014')+'</td><td>'+typeBadge(p.type)+'</td><td>'+esc(p.desc||'\u2014')+'</td><td class="amt">'+money(p.amount)+'</td><td>'+esc(p.category||'Other')+'</td><td>'+stat+'</td></tr>';}).join('')+
  '</tbody></table></div>',
  foot:'<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="impGo">Import selected</button>',
  onMount:function(root){
    root.querySelector('#impGo').addEventListener('click',function(){
      const lines=new Set();
      root.querySelectorAll('.impRow:checked').forEach(function(cb){lines.add(Number(cb.dataset.line));});
      const sel=(pendingImport||[]).filter(function(p){return lines.has(p.line)&&p.status!=='error';});
      if(!sel.length){toast('Nothing selected to import.','err');return;}
      mutate(function(){
        for(const p of sel){
          const catOK=state.settings.incomeCats.includes(p.category)||state.settings.expenseCats.some(function(c){return c.name===p.category;});
          const mv=p.type==='transfer'||p.type==='cc_payment';
          state.transactions.push({id:uid(),date:p.date,type:p.type,description:p.desc,amount:p.amount,
            category:mv?'':(catOK?p.category:(p.type==='income'?'Other Income':'Other')),
            fromAccount:(p.type==='expense'||mv)?(p.from||null):null,
            toAccount:(p.type==='income'||p.type==='refund')?(p.to||p.from||null):(mv?(p.to||null):null),
            method:p.method||'',notes:p.notes||'',tags:(p.tags?p.tags.split(';').map(function(x){return x.trim();}).filter(Boolean):[]),recurringId:null,refundOf:null});
        }
      });
      closeModal();toast(sel.length+' transaction(s) imported.','ok');
    });
  }});
}
